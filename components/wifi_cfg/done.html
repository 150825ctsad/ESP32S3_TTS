<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Configuration Successful</title>
<style>
:root {
  --accent: #2563eb;
  --bg-grad-1: #eef2ff;
  --bg-grad-2: #e0f2fe;
  --surface: #ffffff;
  --text: #0f172a;
  --text-muted: #64748b;
  --success: #16a34a;
  --shadow: 0 10px 30px rgba(15,23,42,0.08),0 2px 6px rgba(15,23,42,0.04);
  --radius: 14px;
}
@media (prefers-color-scheme:dark) {
  :root {
    --bg-grad-1: #0b1220;
    --bg-grad-2: #111827;
    --surface: #1e293b;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --success: #4ade80;
    --shadow: 0 12px 34px rgba(0,0,0,0.45);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:var(--text);
  background:linear-gradient(160deg,var(--bg-grad-1),var(--bg-grad-2));
  background-attachment:fixed;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.card{
  background:var(--surface);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:48px 32px;
  max-width:400px;width:100%;
  text-align:center;
}
.check{width:72px;height:72px;margin:0 auto 20px;border-radius:50%;background:var(--success);display:flex;align-items:center;justify-content:center}
.check svg{width:36px;height:36px;color:#fff}
h2{font-size:22px;margin-bottom:8px}
p{color:var(--text-muted);font-size:14px;margin-bottom:24px}
button{
  width:100%;padding:12px;background:var(--accent);color:#fff;
  border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;
}
button:active{transform:translateY(1px)}
#msg{font-size:13px;color:var(--text-muted);margin-top:12px}
</style>
</head>
<body>
<div class="card">
  <div class="check">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>
  <h2>连接成功！</h2>
  <p id="message">您的设备正在连接到Wi-Fi网络。</p>
  <button onclick="window.close()">完成</button>
  <p id="msg">您可以关闭此页面。</p>
</div>
<script>
(function(){
  var p = new URLSearchParams(location.search);
  var m = p.get('message');
  if (m) document.getElementById('message').textContent = m;
})();
</script>
</body>
</html>
